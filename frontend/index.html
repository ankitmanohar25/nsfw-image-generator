<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NSFW Image Generator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #1e1e2e 0%, #2d2d44 100%);
            color: #e0e0e0;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        header {
            text-align: center;
            margin-bottom: 40px;
            padding: 20px 0;
            border-bottom: 2px solid #ff006e;
        }
        h1 {
            font-size: 2.5em;
            color: #ff006e;
            margin-bottom: 10px;
        }
        .subtitle {
            color: #a0a0a0;
            font-size: 1.1em;
        }
        .main-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-bottom: 40px;
        }
        @media (max-width: 900px) {
            .main-content {
                grid-template-columns: 1fr;
            }
        }
        .panel {
            background: #262635;
            border-radius: 12px;
            padding: 25px;
            border: 1px solid #3a3a4e;
        }
        .panel h2 {
            color: #ff006e;
            margin-bottom: 20px;
            font-size: 1.5em;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #e0e0e0;
            font-weight: 500;
        }
        input[type="text"],
        input[type="number"],
        textarea,
        select {
            width: 100%;
            padding: 12px;
            border: 1px solid #3a3a4e;
            border-radius: 6px;
            background: #1e1e2e;
            color: #e0e0e0;
            font-size: 1em;
            transition: border-color 0.3s;
        }
        input[type="text"]:focus,
        input[type="number"]:focus,
        textarea:focus,
        select:focus {
            outline: none;
            border-color: #ff006e;
            box-shadow: 0 0 0 3px rgba(255, 0, 110, 0.1);
        }
        textarea {
            resize: vertical;
            min-height: 100px;
            font-family: inherit;
        }
        .slider-container {
            display: flex;
            gap: 15px;
            align-items: center;
        }
        input[type="range"] {
            flex: 1;
            height: 6px;
            border-radius: 3px;
            background: #3a3a4e;
            outline: none;
            -webkit-appearance: none;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #ff006e;
            cursor: pointer;
            transition: background 0.2s;
        }
        input[type="range"]::-webkit-slider-thumb:hover {
            background: #ff3399;
        }
        input[type="range"]::-moz-range-thumb {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #ff006e;
            cursor: pointer;
            border: none;
        }
        .slider-value {
            min-width: 50px;
            text-align: right;
            color: #ff006e;
            font-weight: bold;
        }
        button {
            width: 100%;
            padding: 12px 24px;
            background: #ff006e;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 10px;
        }
        button:hover:not(:disabled) {
            background: #ff3399;
            transform: translateY(-2px);
            box-shadow: 0 8px 16px rgba(255, 0, 110, 0.3);
        }
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }
        .gallery-item {
            position: relative;
            border-radius: 8px;
            overflow: hidden;
            aspect-ratio: 1;
            background: #1e1e2e;
            border: 1px solid #3a3a4e;
            transition: transform 0.3s, box-shadow 0.3s;
        }
        .gallery-item:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 16px rgba(255, 0, 110, 0.2);
        }
        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .loading-spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 0, 110, 0.3);
            border-top-color: #ff006e;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .status-message {
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 15px;
            font-size: 0.95em;
        }
        .status-success {
            background: #2d5a3d;
            color: #7dd37f;
            border: 1px solid #5a9d5f;
        }
        .status-error {
            background: #5a2d2d;
            color: #ff7f7f;
            border: 1px solid #9d5a5a;
        }
        .status-info {
            background: #2d4a5a;
            color: #7fd3ff;
            border: 1px solid #5a8d9d;
        }
        .prompt-examples {
            background: #1e1e2e;
            padding: 12px;
            border-radius: 6px;
            border-left: 3px solid #ff006e;
            margin-bottom: 15px;
            font-size: 0.9em;
            color: #a0a0a0;
        }
        .history-section {
            margin-top: 40px;
        }
        .history-item {
            background: #262635;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
            border: 1px solid #3a3a4e;
        }
        .history-item-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 10px;
        }
        .history-prompt {
            color: #ff006e;
            font-weight: 600;
            word-break: break-word;
        }
        .history-time {
            color: #a0a0a0;
            font-size: 0.9em;
        }
        .delete-btn {
            background: #8b0000;
            padding: 6px 12px;
            font-size: 0.85em;
            margin-top: 0;
            width: auto;
        }
        .delete-btn:hover {
            background: #b00000;
        }
        .tab-buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            border-bottom: 2px solid #3a3a4e;
        }
        .tab-button {
            padding: 12px 20px;
            background: none;
            color: #a0a0a0;
            border: none;
            border-bottom: 3px solid transparent;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
            margin-bottom: -2px;
        }
        .tab-button.active {
            color: #ff006e;
            border-bottom-color: #ff006e;
        }
        .tab-button:hover {
            color: #e0e0e0;
        }
        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🎨 NSFW Image Generator</h1>
            <p class="subtitle">Generate images from text prompts</p>
        </header>

        <div class="main-content">
            <!-- Left Panel: Input -->
            <div class="panel">
                <h2>📝 Generation Settings</h2>
                
                <div class="tab-buttons">
                    <button class="tab-button active" onclick="switchTab('single')">Single Image</button>
                    <button class="tab-button" onclick="switchTab('batch')">Batch Mode</button>
                </div>

                <!-- Single Image Tab -->
                <div id="single" class="tab-content active">
                    <div class="form-group">
                        <label for="prompt">Prompt</label>
                        <textarea id="prompt" placeholder="Describe the image you want to generate..."></textarea>
                    </div>

                    <div class="form-group">
                        <label for="negativePrompt">Negative Prompt (Optional)</label>
                        <textarea id="negativePrompt" placeholder="What to avoid in the image..."></textarea>
                    </div>

                    <div class="form-group">
                        <label for="numImages">Number of Images</label>
                        <div class="slider-container">
                            <input type="range" id="numImages" min="1" max="4" value="1" onchange="updateValue('numImages')">
                            <span class="slider-value" id="numImagesValue">1</span>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="steps">Inference Steps</label>
                        <div class="slider-container">
                            <input type="range" id="steps" min="10" max="50" value="30" onchange="updateValue('steps')">
                            <span class="slider-value" id="stepsValue">30</span>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="guidance">Guidance Scale</label>
                        <div class="slider-container">
                            <input type="range" id="guidance" min="1" max="20" step="0.5" value="7.5" onchange="updateValue('guidance')">
                            <span class="slider-value" id="guidanceValue">7.5</span>
                        </div>
                    </div>

                    <button onclick="generateImage()" id="generateBtn">Generate Image</button>
                </div>

                <!-- Batch Mode Tab -->
                <div id="batch" class="tab-content">
                    <div class="form-group">
                        <label for="batchPrompts">Prompts (one per line)</label>
                        <textarea id="batchPrompts" placeholder="Prompt 1&#10;Prompt 2&#10;Prompt 3..."></textarea>
                    </div>

                    <div class="form-group">
                        <label for="batchNegativePrompt">Negative Prompt (Optional)</label>
                        <textarea id="batchNegativePrompt" placeholder="What to avoid..."></textarea>
                    </div>

                    <div class="form-group">
                        <label for="batchSteps">Inference Steps</label>
                        <div class="slider-container">
                            <input type="range" id="batchSteps" min="10" max="50" value="30" onchange="updateValue('batchSteps')">
                            <span class="slider-value" id="batchStepsValue">30</span>
                        </div>
                    </div>

                    <button onclick="generateBatch()" id="batchGenerateBtn">Generate Batch</button>
                </div>

                <div id="statusMessage" style="display: none;" class="status-message"></div>
            </div>

            <!-- Right Panel: Gallery -->
            <div class="panel">
                <h2>🖼️ Generated Images</h2>
                <div id="gallery" class="gallery"></div>
            </div>
        </div>

        <!-- History Section -->
        <div class="panel history-section">
            <h2>📜 Generation History</h2>
            <div id="history"></div>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:8000';
        let currentGenerationId = null;

        function updateValue(id) {
            const element = document.getElementById(id);
            document.getElementById(id + 'Value').textContent = element.value;
        }

        function switchTab(tab) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-button').forEach(el => el.classList.remove('active'));
            document.getElementById(tab).classList.add('active');
            event.target.classList.add('active');
        }

        function showStatus(message, type = 'info') {
            const statusEl = document.getElementById('statusMessage');
            statusEl.textContent = message;
            statusEl.className = `status-message status-${type}`;
            statusEl.style.display = 'block';
            setTimeout(() => {
                statusEl.style.display = 'none';
            }, 5000);
        }

        async function generateImage() {
            const prompt = document.getElementById('prompt').value.trim();
            if (!prompt) {
                showStatus('Please enter a prompt', 'error');
                return;
            }

            const btn = document.getElementById('generateBtn');
            btn.disabled = true;
            btn.innerHTML = '<span class="loading-spinner"></span> Generating...';

            try {
                const response = await fetch(`${API_URL}/generate`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        prompt: prompt,
                        negative_prompt: document.getElementById('negativePrompt').value,
                        num_images: parseInt(document.getElementById('numImages').value),
                        num_inference_steps: parseInt(document.getElementById('steps').value),
                        guidance_scale: parseFloat(document.getElementById('guidance').value)
                    })
                });

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }

                const data = await response.json();
                currentGenerationId = data.generation_id;
                displayImages(data.images);
                loadHistory();
                showStatus('✓ Images generated successfully!', 'success');
            } catch (error) {
                showStatus(`Error: ${error.message}`, 'error');
            } finally {
                btn.disabled = false;
                btn.innerHTML = 'Generate Image';
            }
        }

        async function generateBatch() {
            const prompts = document.getElementById('batchPrompts').value.trim().split('\n').filter(p => p.trim());
            if (prompts.length === 0) {
                showStatus('Please enter at least one prompt', 'error');
                return;
            }

            const btn = document.getElementById('batchGenerateBtn');
            btn.disabled = true;
            btn.innerHTML = `<span class="loading-spinner"></span> Generating ${prompts.length} images...`;

            try {
                const response = await fetch(`${API_URL}/batch-generate`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        prompts: prompts,
                        negative_prompt: document.getElementById('batchNegativePrompt').value,
                        num_inference_steps: parseInt(document.getElementById('batchSteps').value)
                    })
                });

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }

                const data = await response.json();
                loadHistory();
                showStatus(`✓ ${data.total_generated} images generated successfully!`, 'success');
            } catch (error) {
                showStatus(`Error: ${error.message}`, 'error');
            } finally {
                btn.disabled = false;
                btn.innerHTML = 'Generate Batch';
            }
        }

        function displayImages(imageNames) {
            const gallery = document.getElementById('gallery');
            gallery.innerHTML = '';
            imageNames.forEach(name => {
                const item = document.createElement('div');
                item.className = 'gallery-item';
                item.innerHTML = `<img src="${API_URL}/image/${name}" alt="Generated image">`;
                gallery.appendChild(item);
            });
        }

        async function loadHistory() {
            try {
                const response = await fetch(`${API_URL}/history`);
                const data = await response.json();
                displayHistory(data.history.reverse());
            } catch (error) {
                console.error('Failed to load history:', error);
            }
        }

        function displayHistory(items) {
            const historyEl = document.getElementById('history');
            if (items.length === 0) {
                historyEl.innerHTML = '<p style="text-align: center; color: #a0a0a0;">No generations yet</p>';
                return;
            }
            historyEl.innerHTML = items.map(item => `
                <div class="history-item">
                    <div class="history-item-header">
                        <div>
                            <div class="history-prompt">${escapeHtml(item.prompt.substring(0, 100))}</div>
                            <div class="history-time">${new Date(item.timestamp).toLocaleString()}</div>
                        </div>
                        <button class="delete-btn" onclick="deleteGeneration('${item.id}')">Delete</button>
                    </div>
                    <div class="gallery" style="grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));">
                        ${item.images.map(img => `
                            <div class="gallery-item" style="cursor: pointer;" onclick="viewImage('${img}')">
                                <img src="${API_URL}/image/${img}" alt="Generated">
                            </div>
                        `).join('')}
                    </div>
                </div>
            `).join('');
        }

        async function deleteGeneration(id) {
            if (!confirm('Delete this generation and all its images?')) return;
            try {
                await fetch(`${API_URL}/history/${id}`, { method: 'DELETE' });
                loadHistory();
                showStatus('✓ Generation deleted', 'success');
            } catch (error) {
                showStatus(`Error: ${error.message}`, 'error');
            }
        }

        function viewImage(name) {
            window.open(`${API_URL}/image/${name}`, '_blank');
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Load history on page load
        loadHistory();
    </script>
</body>
</html>
